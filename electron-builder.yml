appId: com.mrlab.mobilerecoverylab
productName: Mobile Recovery Lab
copyright: Copyright © 2026 MR Lab
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
extraResources:
  # Servicios locales (backend Python congelado: no requiere Python instalado)
  - from: backend/dist/mrlab-backend
    to: backend
  # Componentes integrados: motor Android, motor Apple e inventario SHA-256
  - from: resources/tools
    to: tools
    filter: ["**/*", "!README.md"]
  # Controladores USB que el instalador registra con pnputil
  - from: resources/drivers
    to: drivers
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: MRLab-Setup-${version}.exe
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  # Instalación para todo el equipo (requiere administrador) para poder registrar controladores USB.
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mobile Recovery Lab
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  language: "3082"
  installerLanguages: ["es_ES"]
