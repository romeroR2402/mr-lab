name: Instalador de Windows

# Una sola compilación por versión: al publicarla en Releases (o a mano desde Actions).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias de Python
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Pruebas del backend
        working-directory: backend
        run: python -m unittest discover -s tests -t .

      - name: Integrar motor Android (adb / fastboot)
        run: python scripts/fetch_components.py --only platform-tools --strict

      - name: Integrar controlador USB Android
        continue-on-error: true
        run: python scripts/fetch_components.py --only android-usb-driver --strict

      # Motor Apple: libimobiledevice (LGPL-2.1) compilado por MSYS2 para Windows.
      # Si falla, el instalador se publica igualmente con el motor Android.
      - name: Instalar libimobiledevice (MSYS2)
        id: apple
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-libimobiledevice

      - name: Reunir motor Apple y sus bibliotecas
        id: apple_collect
        if: steps.apple.outcome == 'success'
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p apple_engine
          for t in idevice_id ideviceinfo idevicepair idevicediagnostics idevicebackup2 ideviceenterrecovery; do
            cp "/mingw64/bin/$t.exe" apple_engine/
          done
          for f in apple_engine/*.exe; do ldd "$f"; done | awk '{print $3}' | grep -i '^/mingw64/' | sort -u | xargs -I{} cp {} apple_engine/
          mkdir -p apple_engine/licencias
          cp -r /mingw64/share/licenses/libimobiledevice apple_engine/licencias/ 2>/dev/null || true
          ls -la apple_engine

      - name: Integrar motor Apple
        if: steps.apple_collect.outcome == 'success'
        continue-on-error: true
        run: python scripts/fetch_components.py --only libimobiledevice --local libimobiledevice=apple_engine --strict

      - name: Empaquetar servicios locales (PyInstaller)
        working-directory: backend
        run: pyinstaller --noconfirm --clean mrlab-backend.spec

      - name: Dependencias de Node
        run: npm ci

      - name: Compilar instalador
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Guardar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MRLab-Setup
          path: release/*.exe

      - name: Adjuntar instalador a la versión
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
          else
            gh release create "$TAG" release/*.exe --title "MR Lab $TAG" --notes-file .github/release-notes.md
          fi
