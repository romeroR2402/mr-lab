name: Instalador de Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias de Python
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Pruebas del backend
        working-directory: backend
        run: python -m unittest discover -s tests -t .

      - name: Integrar motor Android (adb / fastboot)
        run: python scripts/fetch_components.py --only platform-tools --strict

      - name: Integrar controlador USB Android
        continue-on-error: true
        run: python scripts/fetch_components.py --only android-usb-driver --strict

      - name: Empaquetar servicios locales (PyInstaller)
        working-directory: backend
        run: pyinstaller --noconfirm --clean mrlab-backend.spec

      - name: Dependencias de Node
        run: npm ci

      - name: Compilar instalador
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Guardar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MRLab-Setup
          path: release/*.exe

      - name: Publicar versión descargable
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release/*.exe \
            --title "MR Lab ${{ github.ref_name }}" \
            --notes-file .github/release-notes.md
